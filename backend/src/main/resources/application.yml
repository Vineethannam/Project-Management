spring:
  application:
    name: projectsphere
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/projectsphere}
    username: ${DATABASE_USER:projectsphere}
    password: ${DATABASE_PASSWORD}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  port: ${PORT:8080}
  error:
    include-message: never
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: strict
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  bootstrap-email: ${BOOTSTRAP_EMAIL:}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
